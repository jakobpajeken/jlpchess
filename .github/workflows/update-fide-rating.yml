name: Update FIDE rating

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    # GitHub Actions cron can run a little late during busy periods —
    # that's normal and fine for a once-a-month update.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  update-rating:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch current classical rating + world rank from FIDE
        run: python scripts/update_fide_rating.py

      - name: Commit rating.json if it changed
        run: |
          git config user.name "fide-rating-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rating.json
          git diff --cached --quiet || git commit -m "Update FIDE rating and world ranking"
          git push
